[package]
name = "n2x-kv"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "memory-mapped key-value store for n2x"
keywords = ["key-value", "cache", "store", "memmap", "mmkv"]
readme = "README.md"
exclude = ["examples/"]

[features]
default = []
# 为 `TypedStore` 增加 `get_json` / `set_json`。默认关闭，基础存储不带序列化依赖。
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
parking_lot.workspace = true
thiserror.workspace = true
log.workspace = true
memmap2.workspace = true
crc32fast.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
