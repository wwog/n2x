[workspace]
members = [
    "crates/n2x",
    "crates/n2x-core",
    "crates/n2x-kv",
    "crates/n2x-runtime",
]
resolver = "3"
default-members = ["crates/n2x"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wwog/n2x"

[workspace.dependencies]
n2x-kv = { path = "crates/n2x-kv" }
n2x-core = { path = "crates/n2x-core", default-features = false }
n2x-runtime = { path = "crates/n2x-runtime", default-features = false }

memmap2 = "^0.9.12"
parking_lot = "^0.13.0"
thiserror = "^2.0.21"
crc32fast = "^1.5.4"
log = "^0.4.35"
serde = "^1.0.229"
serde_json = "^1.0.154"
